name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:

jobs:
  api:
    name: API · pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pepito
          POSTGRES_PASSWORD: pepito
          POSTGRES_DB: pepito
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pepito" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migraciones sobre base limpia
        env:
          DATABASE_URL: postgresql+psycopg://pepito:pepito@localhost:5433/pepito
        run: alembic upgrade head
      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pepito:pepito@localhost:5433/pepito_test
          RUN_SCHEDULER: "false"
        run: python -m pytest -q

  web:
    name: ${{ matrix.app }} · vitest + build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [operator, backoffice]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  docker:
    name: docker compose build + smoke
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker compose build
      - name: Up + health
        env:
          JWT_SECRET: ci-secret-solo-para-pruebas-de-integracion-0123456789
          SEED_MODE: demo
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/v1/health && break
            sleep 2
            [ "$i" = 60 ] && { docker compose logs api; exit 1; }
          done
          curl -fsS -o /dev/null http://localhost:8081/
          curl -fsS -o /dev/null http://localhost:8082/
          TOKEN=$(curl -fsS -X POST http://localhost:8000/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"op1","password":"op123","device_id":"ci-smoke"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -fsS http://localhost:8000/v1/me/assignment -H "Authorization: Bearer $TOKEN" | head -c 300
      - name: Evidencia en MinIO (foto en NECESITO AYUDA → GET /v1/evidence → archivo)
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8000/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"op2","password":"op123","device_id":"ci-ev"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          PNG=iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAEElEQVR4nGP438AARwzEcQB+ohfxXaFgBQAAAABJRU5ErkJggg==
          KEY=$(python3 -c 'import uuid;print(uuid.uuid4())')
          CASE=$(curl -fsS -X POST http://localhost:8000/v1/help-cases -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"idempotency_key\":\"$KEY\",\"occurred_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"category\":\"other\",\"note\":\"ci foto\",\"photo_base64\":\"data:image/png;base64,$PNG\"}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["case_id"])')
          EV=$(curl -fsS "http://localhost:8000/v1/evidence?entity=case&entity_id=$CASE" -H "Authorization: Bearer $TOKEN")
          echo "$EV" | head -c 400; echo
          URL=$(echo "$EV" | python3 -c 'import sys,json;e=json.load(sys.stdin);assert len(e)==1,e;print(e[0]["url"])')
          curl -fsS -o /tmp/ev.png -H "Authorization: Bearer $TOKEN" "http://localhost:8000$URL" && file /tmp/ev.png | grep -q PNG && echo "evidencia OK"
      - name: HTTPS vía Caddy (CA interna)
        run: |
          curl -kfsS -o /dev/null -w "operador https %{http_code}\n" https://localhost:8443/
          curl -kfsS -o /dev/null -w "backoffice https %{http_code}\n" https://localhost:8444/
          curl -kfsS https://localhost:8445/v1/health
      - name: Seed prod rechaza demo en producción
        run: |
          set +e
          docker compose run --rm -e APP_ENV=production -e SEED_MODE=demo -e JWT_SECRET=ci-secret-solo-para-pruebas-de-integracion-0123456789 -e CORS_ORIGINS=http://localhost api python -m app.seed
          [ $? -ne 0 ] && echo "OK: seed demo rechazado en producción" || { echo "ERROR: seed demo aceptado en producción"; exit 1; }
      - if: always()
        run: docker compose down -v
