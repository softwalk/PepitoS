# PEPITO OS — entorno completo (dev/staging). Producción: misma composición con secretos reales y TLS delante.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pepito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pepito}
      POSTGRES_DB: pepito
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pepito -d pepito"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"

  api:
    build: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://pepito:${POSTGRES_PASSWORD:-pepito}@db:5432/pepito
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-por-uno-largo-y-aleatorio-de-32-bytes}
      TZ_NAME: America/Mexico_City
      RULES_INTERVAL_SECONDS: 300
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RUN_SCHEDULER: "true"
      # demo (datos de prueba) | prod (solo admin con ADMIN_INITIAL_PASSWORD, obliga a cambiarla) | none
      SEED_MODE: ${SEED_MODE:-demo}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      # Evidencias (fotos) en MinIO interno; la API sirve los archivos (no hace falta exponer MinIO)
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_BUCKET: pepito-evidence
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-pepito}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-pepito-minio-cambiar}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  operator:
    build: ./apps/operator
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:80"

  backoffice:
    build: ./apps/backoffice
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8082:80"

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pepito}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pepito-minio-cambiar}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Consola opcional en http://<host>:9001 (no expuesta por defecto)

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/pepito-evidence &&
      echo 'bucket pepito-evidence listo'"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pepito}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pepito-minio-cambiar}

  # HTTPS para la PWA (service worker, instalación y GPS exigen https fuera de localhost).
  # Sin dominio: certificado de CA interna de Caddy (instalar la raíz en los teléfonos, ver docs/HTTPS.md).
  # Con dominio público: SITE_OPERATOR=https://operador.midominio.mx etc. y Caddy usa Let's Encrypt.
  caddy:
    image: caddy:2.9-alpine
    depends_on:
      - operator
      - backoffice
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      SITE_OPERATOR: ${SITE_OPERATOR:-https://${PUBLIC_HOST:-localhost}:8443}
      SITE_BACKOFFICE: ${SITE_BACKOFFICE:-https://${PUBLIC_HOST:-localhost}:8444}
      SITE_API: ${SITE_API:-https://${PUBLIC_HOST:-localhost}:8445}
      CADDY_TLS: ${CADDY_TLS:-tls internal}
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
      - "8444:8444"
      - "8445:8445"
      - "8446:8446"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
